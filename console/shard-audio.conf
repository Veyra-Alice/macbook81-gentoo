# Private console image: explicit playback-only nodes, no capture devices.
context.properties = { default.clock.rate = 44100 default.clock.allowed-rates = [ 44100 ] }
context.objects = [
 { factory = adapter args = {
   factory.name = api.alsa.pcm.sink
   node.name = Shard_Speakers node.description = "MacBook8,1 Speakers (hardware)"
   media.class = Audio/Sink api.alsa.path = "hw:PCH,2"
   audio.format = S16LE audio.rate = 44100 audio.channels = 4
   audio.position = [ FL FR RL RR ]
   api.alsa.soft-mixer = true api.alsa.disable-mmap = true
   session.suspend-timeout-seconds = 0 priority.session = 100
 } }
 { factory = adapter args = {
   factory.name = api.alsa.pcm.sink
   node.name = Shard_Headphones node.description = "MacBook8,1 Headphones (hardware)"
   media.class = Audio/Sink api.alsa.path = "hw:PCH,0"
   audio.format = S16LE audio.rate = 44100 audio.channels = 2
   audio.position = [ FL FR ] api.alsa.soft-mixer = true
   session.suspend-timeout-seconds = 0 priority.session = 100
 } }
]
context.modules = [
 { name = libpipewire-module-filter-chain args = {
   node.description = "MacBook8,1 Audio"
   filter.graph = {
     nodes = [
       { type = builtin name = L label = copy }
       { type = builtin name = R label = copy }
       { type = builtin name = frontL label = copy }
       { type = builtin name = frontR label = copy }
       { type = builtin name = rearL label = copy }
       { type = builtin name = rearR label = copy }
     ]
     links = [ { output = "L:Out" input = "rearL:In" }
               { output = "R:Out" input = "rearR:In" }
               { output = "L:Out" input = "frontL:In" }
               { output = "R:Out" input = "frontR:In" } ]
     inputs = [ "L:In" "R:In" ]
     outputs = [ "frontL:Out" "frontR:Out" "rearL:Out" "rearR:Out" ]
   }
   capture.props = {
     node.name = Shard_Audio media.class = Audio/Sink
     audio.channels = 2 audio.position = [ FL FR ] priority.session = 2000
   }
   playback.props = {
     node.name = Shard_Output target.object = Shard_Speakers
     audio.channels = 4 audio.position = [ FL FR RL RR ]
     stream.dont-remix = true node.dont-fallback = true
   }
 } }
]
